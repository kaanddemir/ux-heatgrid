<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Backgrounds</title><link rel="stylesheet" href="base.css">
<style>.box{padding:12px;margin:8px}p{margin:0}
#pseudo-host{position:relative;padding:20px;background:#fff}#pseudo-host::before{content:"";position:absolute;inset:0;background:#000;z-index:0}#pseudo-host p{position:relative;color:#fff}
#behind-canvas{position:relative;height:80px}#behind-canvas canvas{position:absolute;inset:0;width:100%;height:100%;background:#000}#behind-canvas p{position:relative;color:#fff}</style></head><body>
<p id="t-black" style="color:#000">Black on white</p>
<p id="t-grey" style="color:#767676">Grey 767676 on white</p>
<div style="background:#1a1a1a" class="box"><p id="t-white-dark" style="color:#fff">White on dark</p></div>
<div style="background:rgb(0,0,255)" class="box"><div style="background:rgba(255,255,255,0.5)" class="box"><p id="t-translucent-child" style="color:#000">Translucent child</p></div></div>
<div style="background:rgb(255,0,0)" class="box"><div style="background:rgba(0,0,0,0.5)" class="box"><div style="background:rgba(255,255,255,0.25)" class="box"><p id="t-multi" style="color:#fff">Multiple layers</p></div></div></div>
<div style="background:rgb(20,120,60)" class="box"><button id="t-ghost-btn" style="background:transparent;color:#fff;border:1px solid #fff">Ghost button</button></div>
<p id="t-translucent-text" style="color:rgba(0,0,0,0.6)">Translucent text</p>
<div style="background:linear-gradient(#000,#333)" class="box"><p id="u-gradient" style="color:#fff">On gradient</p></div>
<div style="background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22/%3E');background-color:#fff" class="box"><p id="u-image">On image</p></div>
<div id="pseudo-host"><p id="u-pseudo">On pseudo-element background</p></div>
<div style="filter:invert(1)" class="box"><p id="u-filter">Filtered</p></div>
<div style="mix-blend-mode:multiply;background:#fff" class="box"><p id="u-blend">Blended</p></div>
<div id="behind-canvas"><canvas></canvas><p id="u-canvas-sibling">On canvas sibling (non-ancestor)</p></div>
<p id="u-opacity" style="opacity:0.5">Half opacity</p>
<p id="t-shadow" style="color:#fff;text-shadow:0 0 4px #000">Text shadow on white</p>
</body></html>
