<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Nested scroll</title><link rel="stylesheet" href="base.css">
<style>html,body{height:100%;overflow:hidden}.app{display:flex;height:100vh}
#sidebar{width:280px;overflow-y:auto;border-right:1px solid #ddd}#feed{flex:1;overflow-y:scroll}
#hscroll{overflow-x:auto;white-space:nowrap;width:600px;height:220px}#hscroll div{display:inline-block;width:300px;height:180px;margin:4px;background:#eef}
#clipped{overflow:hidden;width:400px;height:200px}#auto-fits{overflow:auto;width:400px;height:200px}#tiny{overflow:auto;width:120px;height:80px}
#inner{overflow:auto;height:300px;width:500px;border:1px solid #ccc}</style></head><body>
<div class="app">
<aside id="sidebar" aria-label="Sidebar"><div id="side-items"></div></aside>
<div id="feed"><h1>Feed</h1>
  <div id="hscroll"><div>1</div><div>2</div><div>3</div><div>4</div></div>
  <div id="clipped"><div style="height:900px">tall hidden</div></div>
  <div id="auto-fits"><p>fits</p></div>
  <div id="tiny"><div style="height:400px">tiny tall</div></div>
  <div id="inner"><div style="height:1500px"><button id="inner-top">Inner top</button><div style="height:1000px"></div><button id="inner-bottom">Inner bottom (scrolled out)</button></div></div>
  <div style="height:3000px"></div>
</div></div>
<script>const s=document.getElementById('side-items');for(let i=0;i<60;i++){const a=document.createElement('a');a.href='/s'+i;a.textContent='Item '+i;a.style.display='block';a.style.padding='8px';s.appendChild(a);}</script>
</body></html>
